<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Ship Rigging / Rope Silhouette -->
  <g stroke="#2b2015" stroke-linecap="round">
    <!-- Main shroud ropes (vertical/angled) -->
    <line x1="20" y1="10" x2="60" y2="190" stroke-width="4"/>
    <line x1="50" y1="10" x2="80" y2="190" stroke-width="4"/>
    <line x1="80" y1="10" x2="100" y2="190" stroke-width="4"/>
    <line x1="110" y1="10" x2="120" y2="190" stroke-width="4"/>
    <line x1="140" y1="10" x2="140" y2="190" stroke-width="4"/>
    <line x1="170" y1="10" x2="160" y2="190" stroke-width="4"/>

    <!-- Ratlines (horizontal horizontal steps across shrouds) -->
    <path d="M22 30 L168 30 M24 50 L167 50 M27 70 L166 70 M30 90 L165 90 M33 110 L164 110 M36 130 L163 130 M39 150 L162 150 M42 170 L161 170" stroke-width="2.5"/>

    <!-- Pulley / Dead-eye blocks at top -->
    <circle cx="20" cy="12" r="5" fill="#2b2015"/>
    <circle cx="50" cy="12" r="5" fill="#2b2015"/>
    <circle cx="80" cy="12" r="5" fill="#2b2015"/>
    <circle cx="110" cy="12" r="5" fill="#2b2015"/>
    <circle cx="140" cy="12" r="5" fill="#2b2015"/>
    <circle cx="170" cy="12" r="5" fill="#2b2015"/>
  </g>
</svg>
