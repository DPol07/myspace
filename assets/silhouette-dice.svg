<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Pair of Pirate Dice Silhouette -->
  <g fill="#2b2015">
    <!-- Die 1 (Angled Left) -->
    <g transform="translate(30, 40) rotate(-15 50 50)">
      <rect x="15" y="15" width="70" height="70" rx="12" fill="#2b2015"/>
      <!-- Pips (White/Transparent cutout) -->
      <circle cx="32" cy="32" r="6" fill="#120c08"/>
      <circle cx="68" cy="32" r="6" fill="#120c08"/>
      <circle cx="50" cy="50" r="6" fill="#120c08"/>
      <circle cx="32" cy="68" r="6" fill="#120c08"/>
      <circle cx="68" cy="68" r="6" fill="#120c08"/>
    </g>
    <!-- Die 2 (Angled Right overlapping behind) -->
    <g transform="translate(85, 75) rotate(20 50 50)">
      <rect x="15" y="15" width="65" height="65" rx="10" fill="#2b2015"/>
      <circle cx="30" cy="30" r="5.5" fill="#120c08"/>
      <circle cx="65" cy="65" r="5.5" fill="#120c08"/>
      <circle cx="47.5" cy="47.5" r="5.5" fill="#120c08"/>
    </g>
  </g>
</svg>
