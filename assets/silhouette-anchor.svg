<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Anchor Silhouette -->
  <g fill="#2b2015" stroke="#2b2015">
    <!-- Top Ring -->
    <circle cx="100" cy="25" r="14" fill="none" stroke-width="7"/>
    <!-- Crossbar / Stock -->
    <rect x="50" y="48" width="100" height="12" rx="3"/>
    <circle cx="50" cy="54" r="8"/>
    <circle cx="150" cy="54" r="8"/>
    <!-- Vertical Shank -->
    <rect x="93" y="35" width="14" height="125" rx="3"/>
    <!-- Curved Flukes / Arms -->
    <path d="M30 115 C 30 175, 170 175, 170 115" fill="none" stroke-width="14" stroke-linecap="round"/>
    <!-- Left Crown Tip / Arrow -->
    <polygon points="30,100 15,122 45,122" fill="#2b2015"/>
    <!-- Right Crown Tip / Arrow -->
    <polygon points="170,100 155,122 185,122" fill="#2b2015"/>
    <!-- Bottom Crown Point -->
    <polygon points="100,180 88,160 112,160" fill="#2b2015"/>
    <!-- Wrapped Chain -->
    <path d="M100 20 Q 120 30 110 50 Q 80 65 92 90 Q 115 110 100 140" fill="none" stroke="#2b2015" stroke-width="5" stroke-dasharray="8 4"/>
  </g>
</svg>
