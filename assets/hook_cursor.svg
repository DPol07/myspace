<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <!-- Gunmetal Steel Gradient -->
    <linearGradient id="hookMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="30%" stop-color="#90a4ae"/>
      <stop offset="70%" stop-color="#455a64"/>
      <stop offset="100%" stop-color="#1c272c"/>
    </linearGradient>
    <linearGradient id="cuffMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="50%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base Socket / Cuff -->
    <path d="M 2 2 C 2 1, 6 1, 6 2 L 6 6 C 6 7, 2 7, 2 6 Z" fill="url(#cuffMetal)" stroke="#102027" stroke-width="0.5"/>
    <rect x="2" y="5" width="4" height="1.5" fill="#cfd8dc" opacity="0.6"/>

    <!-- Hook Curve starting near tip (2,2) for hotspot precision -->
    <path d="M 3 6
             C 3 13, 14 15, 14 9
             C 14 5, 9 3, 5 3
             C 4 3, 3.5 3.5, 4 4.2
             C 4.5 4.8, 5.5 4.8, 6.5 4.8
             C 8.5 4.8, 11.5 6.2, 11.5 9
             C 11.5 12, 5 10.5, 5 6 Z"
          fill="url(#hookMetal)"
          stroke="#102027"
          stroke-width="0.6"
          stroke-linejoin="round"/>

    <!-- Sharp Hook Tip Highlight -->
    <path d="M 5 3 L 3.5 3.5 L 4.2 4.5 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
